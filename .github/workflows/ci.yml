name: ci

on:
  push:
  pull_request:

jobs:
  # The tests run where the releases run that can run them. The Windows
  # binary is built and vetted, not tested: the tests' file trees are
  # written with POSIX paths.
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      # The editor tests (go test ./editors) need Neovim 0.11 or later,
      # and fail without it where CI is set. Vim is on both images.
      - if: runner.os == 'Linux'
        run: |
          curl -fsSL https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - if: runner.os == 'macOS'
        run: brew install neovim
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      - if: matrix.os == 'ubuntu-latest'
        run: GOOS=windows go build ./... && GOOS=windows go vet ./...

  # Formatting and static analysis run with the current Go release, which
  # the pinned staticcheck is built with; the code is checked as the Go
  # version of go.mod. staticcheck runs twice: as everybody builds the
  # code, and with the files only the corpus tests build, which use
  # helpers the first run must not see as unused.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
      - run: staticcheck ./...
      - run: staticcheck -tags corpus ./...

  # The VS Code client is TypeScript: its types are checked, its tests
  # run and the extension is built, with the tools its lockfile pins.
  # (go test ./editors compares its manifest with its code.)
  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run check
      # The tests load the bundle, so it is built first.
      - run: npm run build
      - run: npm test

  # The packages of the extension, made as a release makes them
  # (release.yml), from the binaries of a GoReleaser snapshot: one for
  # each platform with its binary inside, and one without. Nothing is
  # published, here or by the script.
  vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: build --snapshot --clean
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
        working-directory: editors/vscode
      - run: node scripts/vsix.mts --dist ../../dist --out ../../vsix
        working-directory: editors/vscode
      - name: Seven packages; the one for this machine has a dgdtools that runs, the one for the rest has none
        run: |
          ls -l vsix
          test "$(ls vsix/*.vsix | wc -l)" -eq 7
          unzip -q vsix/dgdtools-linux-x64-*.vsix -d linux-x64
          linux-x64/extension/bin/dgdtools version
          unzip -Z1 vsix/dgdtools-win32-x64-*.vsix | grep -qx 'extension/bin/dgdtools.exe'
          if unzip -Z1 vsix/dgdtools-[0-9]*.vsix | grep '^extension/bin/'; then exit 1; fi
