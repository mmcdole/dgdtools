# dgdtools.yml: configuration for dgdtools (lint, format, rename, lsp).
#
# Put it at the top of your mud, next to the lib and the DGD driver config.
# Every key is optional. See docs/configuration.md for the full reference
# and examples/viking/dgdtools.yml for a real mudlib.
#
# A wizard with only their own directory needs one line instead:
#
#     profile: mymud           # mymud.profile, built with `dgdtools profile build`

root: lib                      # the directory that is "/" to the driver
driver_config: etc/mud.dgd     # DGD driver config: include_dirs, include_file,
                               # auto_object, driver_object, typechecking

exclude:                       # lib-relative globs that directory walks skip
  - "**/old/**"

dialect:
  slash_slash: true            # // comments (DGD's SLASHSLASH, default true)
  closures: false              # function pointers (DGD's CLOSURES, default false)
  kfuns:                       # kfuns of the driver's extension modules
    - "int *rusage()"

# relative_object_paths: root  # "std/room" is relative to: root (default) | file

conventions:                   # the mudlib's own habits; nothing by default
  create: create               # what objects define to be initialized (default create)
  macros:                      # macro classes, for files read without their header
    public: specifier          #   #define public
  defines: []                  # names taken as defined for #ifdef
  call_registry:               # functions that call a function by name (0-based args)
    add_action: { function: 0 }
  object_registry: {}          # functions that take an object path: { load: 0 }
  autosave_markers: []         # names that mark an object as using save_object
  virtual_paths: []            # lib globs served by virtual-object daemons

profile_build:                 # `dgdtools profile build`, and checkout layout
  name: mymud
  share: ["kernel/**", "lib/**"]   # shared code always put in the profile
  share_min_owners: 5          # also share files used by this many owners (0: off)
  omit: []                     # never put in the profile
  checkouts: ["usr/*"]         # per-wizard directories

format:                        # unset keys fall back to .editorconfig
  indent_style: space          # space | tab
  indent_width: 4
  line_endings: preserve       # preserve | lf | crlf

lint:
  rules:                       # rule, code or group: off | info | warning | error
    unreachable-code: warning
    raw-inherit-path: { severity: warning, deny: ["/lib/"] }   # with options
  overrides:
    - paths: ["usr/**"]
      rules: { runtime: off }
  baseline: dgdtools-baseline.json   # written by `dgdtools lint --write-baseline`

# A nested dgdtools.yml with `root: false` (or only format: and lint:)
# adjusts format: and lint: for its directory.
